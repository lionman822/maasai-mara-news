<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>马赛马拉新闻观察 · Maasai Mara News Watch 2026</title>
<meta name="description" content="2026 年马赛马拉（肯尼亚）近期新闻可视化汇总：迁徙、保护、旅游、政策与社区。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--sand:#f5ecd9;--sand2:#ead9b8;--earth:#3b2a1a;--ochre:#c8792b;--savanna:#d9a441;--acacia:#5b7a3a;--dusk:#8a3b23;--ink:#2b2118;--muted:#7a6a55;--card:#fffaf0;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--sand);color:var(--ink);line-height:1.65}
a{color:var(--dusk)}
.hero{position:relative;min-height:440px;color:#fff8ea;display:flex;align-items:flex-end;overflow:hidden;
 background:linear-gradient(180deg,#f2a541 0%,#e0702f 38%,#9b3a1f 70%,#3b2a1a 100%)}
.hero .sun{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#ffe7a3 0%,#ffc35a 55%,rgba(255,195,90,0) 72%);left:62%;top:70px}
.hero svg.sil{position:absolute;bottom:0;left:0;width:100%;height:220px}
.hero .inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:48px 24px 40px;width:100%}
.kicker{letter-spacing:.25em;font-size:13px;text-transform:uppercase;opacity:.9}
.hero h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(34px,6vw,64px);margin:.15em 0 .1em;text-shadow:0 3px 18px rgba(0,0,0,.35)}
.hero p.sub{max-width:720px;font-size:17px;opacity:.95;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:-34px;position:relative;z-index:3}
.stat{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 6px 24px rgba(59,42,26,.12);border-top:5px solid var(--ochre)}
.stat b{display:block;font-family:"Noto Serif SC",serif;font-size:34px;color:var(--earth);line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
section{margin:44px 0}
h2{font-family:"Noto Serif SC",serif;font-size:26px;margin:0 0 6px;color:var(--earth)}
h2 small{font-family:"Noto Sans SC";font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 18px rgba(59,42,26,.08)}
#map{height:430px;border-radius:12px}
.note{font-size:13px;color:var(--muted)}
/* timeline */
.timeline{position:relative;overflow-x:auto;padding:30px 4px 10px}
.tl-track{position:relative;height:130px;min-width:900px}
.tl-line{position:absolute;left:0;right:0;top:64px;height:4px;background:linear-gradient(90deg,var(--savanna),var(--dusk));border-radius:2px}
.tl-month{position:absolute;top:76px;font-size:12px;color:var(--muted);transform:translateX(-50%)}
.tl-tick{position:absolute;top:58px;width:2px;height:16px;background:#bfa47c}
.tl-dot{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #fffaf0;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s}
.tl-dot:hover{transform:translate(-50%,-50%) scale(1.4)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{border:1.5px solid var(--sand2);background:#fffaf0;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.active{color:#fff;border-color:transparent}
.search{flex:1;min-width:200px;border:1.5px solid var(--sand2);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:14px;background:#fffaf0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{background:var(--card);border-radius:14px;padding:18px 20px 16px;box-shadow:0 4px 18px rgba(59,42,26,.08);display:flex;flex-direction:column;border-left:6px solid var(--ochre);transition:transform .15s,box-shadow .15s;scroll-margin-top:20px}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(59,42,26,.15)}
.card.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{background:var(--card)}30%{background:#ffe9bf}}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:8px}
.badge{color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.card h3{font-family:"Noto Serif SC",serif;font-size:19px;margin:10px 0 2px;line-height:1.4}
.card .en{font-style:italic;color:var(--muted);font-size:13px;margin-bottom:8px}
.card p{margin:0 0 12px;font-size:14.5px}
.card .src{margin-top:auto;font-size:13px;border-top:1px dashed var(--sand2);padding-top:10px}
.card .src a{font-weight:700;text-decoration:none}
.card .src a:hover{text-decoration:underline}
.loc{font-size:12px;color:var(--acacia)}
footer{background:var(--earth);color:#ead9b8;padding:34px 0;margin-top:60px;font-size:14px}
footer a{color:#ffc35a}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.hero{min-height:380px}.hero .sun{left:55%;width:180px;height:180px}#map{height:340px}}
</style>
</head>
<body>
<header class="hero">
 <div class="sun"></div>
 <svg class="sil" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#2a1d12" d="M0 170 Q 200 150 420 165 T 860 160 T 1440 168 V220 H0Z"/>
  <!-- acacia trees -->
  <g fill="#2a1d12">
   <rect x="250" y="95" width="7" height="75"/><ellipse cx="253" cy="92" rx="85" ry="16"/><ellipse cx="225" cy="100" rx="40" ry="9"/><ellipse cx="290" cy="99" rx="45" ry="9"/>
   <rect x="1110" y="110" width="6" height="58"/><ellipse cx="1113" cy="107" rx="66" ry="13"/>
   <!-- giraffe -->
   <path d="M760 168 l4-52 l-4-6 l18-62 l6-4 l10 2 l-2 6 l-8 2 l-16 64 l24 0 l4 52 h-5 l-4-40 l-14 0 l-6 38z"/>
   <!-- wildebeest herd -->
   <g transform="translate(470,140)"><path d="M0 22 q4-14 18-14 q10 0 14 -6 l6 4 l-4 8 q2 10 -2 16 h-3 l0-8 h-20 l-2 8 h-3z"/></g>
   <g transform="translate(520,145) scale(.85)"><path d="M0 22 q4-14 18-14 q10 0 14 -6 l6 4 l-4 8 q2 10 -2 16 h-3 l0-8 h-20 l-2 8 h-3z"/></g>
   <g transform="translate(565,141) scale(.95)"><path d="M0 22 q4-14 18-14 q10 0 14 -6 l6 4 l-4 8 q2 10 -2 16 h-3 l0-8 h-20 l-2 8 h-3z"/></g>
   <g transform="translate(610,147) scale(.8)"><path d="M0 22 q4-14 18-14 q10 0 14 -6 l6 4 l-4 8 q2 10 -2 16 h-3 l0-8 h-20 l-2 8 h-3z"/></g>
  </g>
 </svg>
 <div class="inner">
  <div class="kicker">Maasai Mara News Watch · 肯尼亚</div>
  <h1>马赛马拉新闻观察</h1>
  <p class="sub">追踪马赛马拉近期动态：大迁徙、保护与保护地、旅游与收费政策、社区与安全事件。每条摘要均附原文链接。</p>
 </div>
</header>

<main class="wrap">
 <div class="stats" id="stats"></div>

 <section>
  <h2>时间线 <small>点击圆点查看对应新闻</small></h2>
  <div class="panel timeline"><div class="tl-track" id="timeline"></div></div>
 </section>

 <section class="grid2">
  <div class="panel">
   <h2>按类别统计</h2>
   <canvas id="catChart" height="260"></canvas>
  </div>
  <div class="panel">
   <h2>按月份统计</h2>
   <canvas id="monthChart" height="260"></canvas>
  </div>
 </section>

 <section>
  <h2>新闻地图 <small>标记为报道中提到的地点</small></h2>
  <div class="panel"><div id="map"></div>
  <p class="note">坐标为根据报道中的地名估算的大致位置，仅供示意；未提及具体地点的新闻不在地图上标注。</p></div>
 </section>

 <section>
  <h2>新闻列表</h2>
  <div class="filters" id="filters"></div>
  <div class="cards" id="cards"></div>
 </section>
</main>

<footer>
 <div class="wrap">
  <div><b>马赛马拉新闻观察</b> · 最后更新：<span id="updated"></span></div>
  <p>本页中文摘要由编辑整理，仅为导读；所有内容以原文为准，请点击每条新闻的来源链接阅读原始报道。新闻版权归各原始媒体所有。地图底图 © OpenStreetMap 贡献者。</p>
 </div>
</footer>

<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const N=[...window.NEWS].sort((a,b)=>b.date.localeCompare(a.date));
const C=window.CATS;
const fmt=d=>{const [y,m,dd]=d.split('-');return `${y}年${+m}月${+dd}日`};
const fmtItem=n=>n.datePrecision==='month'?`${n.date.slice(0,4)}年${+n.date.slice(5,7)}月（月报）`:fmt(n.date);
document.getElementById('updated').textContent=fmt(window.NEWS_UPDATED);

// stats
const dates=N.map(n=>n.date).sort();
const catCount={};N.forEach(n=>catCount[n.cat]=(catCount[n.cat]||0)+1);
const topCat=Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
const sources=new Set(N.map(n=>n.source.split('（')[0].split(' (')[0]));
const mapped=N.filter(n=>n.loc).length;
document.getElementById('stats').innerHTML=[
 [N.length,'条新闻'],
 [`${+dates[0].slice(5,7)}–${+dates.at(-1).slice(5,7)}月`,'覆盖时间（2026）'],
 [sources.size,'个信息来源'],
 [Object.keys(catCount).length,'个类别'],
 [mapped,'条带地图标记'],
 [C[topCat[0]].icon+' '+topCat[1],'最多：'+C[topCat[0]].zh]
].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

// timeline
(function(){
 const el=document.getElementById('timeline');
 const start=new Date('2026-04-01'),end=new Date('2026-10-31');
 const pos=d=>((new Date(d)-start)/(end-start))*100;
 let html='<div class="tl-line"></div>';
 for(let m=3;m<=9;m++){const d=new Date(2026,m,1);const p=pos(d.toISOString().slice(0,10));
  html+=`<div class="tl-tick" style="left:${p}%"></div><div class="tl-month" style="left:${Math.min(p+7,97)}%">${m+1}月</div>`;}
 const used={};
 [...N].sort((a,b)=>a.date.localeCompare(b.date)).forEach(n=>{
  const p=pos(n.date);const k=Math.round(p*1.2);used[k]=(used[k]||0)+1;
  const y=66-(used[k]%2?1:-1)*(10+Math.floor((used[k]-1)/2)*20)-0;
  html+=`<div class="tl-dot" title="${fmtItem(n)} · ${n.title_zh}" style="left:${p}%;top:${y}px;background:${C[n.cat].color}" onclick="jump(${n.id})"></div>`;
 });
 el.innerHTML=html;
})();

// charts
Chart.defaults.font.family='"Noto Sans SC",sans-serif';Chart.defaults.color='#5a4a38';
const cats=Object.keys(C).filter(k=>catCount[k]);
new Chart(document.getElementById('catChart'),{type:'doughnut',
 data:{labels:cats.map(k=>C[k].zh),datasets:[{data:cats.map(k=>catCount[k]),backgroundColor:cats.map(k=>C[k].color),borderColor:'#fffaf0',borderWidth:3}]},
 options:{plugins:{legend:{position:'right'}},cutout:'55%'}});
const months=['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10'];
new Chart(document.getElementById('monthChart'),{type:'bar',
 data:{labels:months.map(m=>+m.slice(5)+'月'),datasets:cats.map(k=>({label:C[k].zh,backgroundColor:C[k].color,data:months.map(m=>N.filter(n=>n.cat===k&&n.date.startsWith(m)).length)}))},
 options:{plugins:{legend:{display:false}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{stepSize:1},beginAtZero:true}}}});

// map
const map=L.map('map',{scrollWheelZoom:false}).setView([-1.35,35.25],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const bounds=[];
N.filter(n=>n.loc).forEach(n=>{
 const mk=L.circleMarker([n.loc.lat,n.loc.lng],{radius:9,color:'#fffaf0',weight:2,fillColor:C[n.cat].color,fillOpacity:.95}).addTo(map);
 mk.bindPopup(`<b>${n.title_zh}</b><br><small>${fmtItem(n)} · ${n.loc.name}</small><br><a href="#" onclick="jump(${n.id});return false;">查看摘要 ↓</a> · <a href="${n.url}" target="_blank" rel="noopener">原文</a>`);
 bounds.push([n.loc.lat,n.loc.lng]);
});
if(bounds.length)map.fitBounds(bounds,{padding:[30,30]});

// filters + cards
let cur='all',q='';
const f=document.getElementById('filters');
f.innerHTML=`<button class="chip active" data-c="all" style="background:#3b2a1a">全部 (${N.length})</button>`+
 cats.map(k=>`<button class="chip" data-c="${k}" data-color="${C[k].color}">${C[k].icon} ${C[k].zh} (${catCount[k]})</button>`).join('')+
 `<input class="search" id="q" placeholder="搜索标题、来源或摘要…">`;
f.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.c;
 f.querySelectorAll('.chip').forEach(x=>{x.classList.remove('active');x.style.background='';});
 b.classList.add('active');b.style.background=b.dataset.color||'#3b2a1a';render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
function render(){
 const list=N.filter(n=>(cur==='all'||n.cat===cur)&&(!q||(n.title_zh+n.title_en+n.source+n.summary).toLowerCase().includes(q)));
 document.getElementById('cards').innerHTML=list.length?list.map(n=>`
 <article class="card" id="n${n.id}" style="border-left-color:${C[n.cat].color}">
  <div class="meta"><span>${fmtItem(n)}</span><span class="badge" style="background:${C[n.cat].color}">${C[n.cat].icon} ${C[n.cat].zh}</span></div>
  <h3>${n.title_zh}</h3>
  <div class="en">${n.title_en}</div>
  <p>${n.summary}</p>
  ${n.loc?`<div class="loc">📍 ${n.loc.name}</div>`:''}
  <div class="src">来源：${n.url?`<a href="${n.url}" target="_blank" rel="noopener">${n.source} ↗</a>`:n.source}${(n.also||[]).map(a=>` · <a href="${a.url}" target="_blank" rel="noopener">${a.name} ↗</a>`).join('')}</div>
 </article>`).join(''):'<div class="empty">没有匹配的新闻</div>';
}
function jump(id){
 if(!document.getElementById('n'+id)){cur='all';q='';document.getElementById('q').value='';f.querySelector('[data-c=all]').click();}
 const el=document.getElementById('n'+id);el.scrollIntoView({behavior:'smooth',block:'center'});
 el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}
render();
</script>
</body>
</html>
